---
# yamllint disable rule:line-length
all:
  vars:
    chain_home_clear: true
    chain_version: v27.4.0
    chain_create_validator: true
    faucet_enabled: true
    pingpub_enabled: true
    api_enabled: true
    api_enabled_unsafe_cors: true
    ansible_user: root
    block_sync: false
    chain_gov_testing: true
    chain_expedited_voting_period: 10s
    chain_voting_period: 15s
    # Test upgrade proposal
    test_upgrade: true
    # Amount to deposit after proposal is on chain
    upgrade_proposal_deposit_amount: "450000000uatom"
  children:
    node:
      hosts:
        "{{ target }}":
          chain_id: my-testnet
          chain_moniker: cosmos-node
